<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Touchpad Mode</title>
<style>
* { box-sizing:border-box; }
body { margin:0; padding:14px; background:#f1f3f5; color:#202124;
       font:16px Arial,sans-serif; }
main { max-width:440px; margin:0 auto; }
header { display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px; }
button { border:0; border-radius:9px; padding:12px 16px; background:#e5e9ed; font-size:15px; }
#pad { height:65vh; min-height:300px; background:#fff; border:2px solid #c8cdd2;
       border-radius:16px; display:flex; align-items:center; justify-content:center;
       color:#777; text-align:center; touch-action:none; user-select:none; }
#status { text-align:center; color:#555; font-size:13px; min-height:20px; margin-top:12px; }
p { color:#666; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<main>
<header>
  <button onclick="window.location.href='/'">← Controller</button>
  <strong>Touchpad mode</strong>
</header>
<div id="pad">Touchpad area<br>Touch and drag here</div>
<div id="status">Touchpad interface placeholder</div>
<p>This page is the separate touchpad screen. The touch gesture handling will be added next.</p>
</main>
</body>
</html>
