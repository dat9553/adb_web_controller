<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Touchpad Mode</title>
<style>
* { box-sizing:border-box; }
body { margin:0; padding:14px; background:#f1f3f5; color:#202124;
       font:16px Arial,sans-serif; }
main { max-width:440px; margin:0 auto; }
header { display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px; }
button { border:0; border-radius:9px; padding:12px 16px; background:#e5e9ed; font-size:15px; }
#pad { height:65vh; min-height:300px; padding:10px; background:#fff; border:2px solid #c8cdd2;
       border-radius:16px; display:flex; flex-direction:column; color:#777; text-align:center;
       user-select:none; -webkit-user-select:none; }
#gesture-area { flex:1; display:flex; align-items:center; justify-content:center;
                touch-action:none; }
#pad.active { background:#eaf3fb; border-color:#1769aa; }
#navigation { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
#navigation button { padding:12px 6px; touch-action:manipulation; }
#status { text-align:center; color:#555; font-size:13px; min-height:20px; margin-top:12px; }
p { color:#666; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<main>
<header>
  <button onclick="window.location.href='/'">← Controller</button>
  <strong>Touchpad mode</strong>
</header>
<div id="pad" role="application" aria-label="Touchpad: tap or swipe to control the device">
  <div id="gesture-area">Touch or click and drag here</div>
  <div id="navigation" aria-label="Device navigation">
    <button type="button" onclick="sendKey(187)">Recent</button>
    <button type="button" onclick="sendKey(3)">Home</button>
    <button type="button" onclick="sendKey(4)">Back</button>
  </div>
</div>
<div id="status" role="status" aria-live="polite">Ready — connect to the device first.</div>
<p>Tap to send a tap to the device center. Swipe to send an up, down, left, or right gesture.</p>
</main>
<script>
const pad = document.getElementById("pad");
const gestureArea = document.getElementById("gesture-area");
const status = document.getElementById("status");
const TAP_MAX_DISTANCE = 12;
const SWIPE_MIN_DISTANCE = 30;
// Match the existing controller.html tap defaults / 1080x1920 coordinate space.
const TAP_X = 540;
const TAP_Y = 960;
let activeGesture = null;

async function sendAction(path, payload) {
  status.textContent = "Sending...";
  try {
    const response = await fetch(path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      throw new Error(result.message || ("HTTP " + response.status));
    }
    status.textContent = result.message || "Done";
  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
}

function sendKey(keycode) {
  sendAction("/api/keyevent", {keycode: keycode});
}

gestureArea.addEventListener("pointerdown", (event) => {
  if (activeGesture || (event.pointerType === "mouse" && event.button !== 0)) return;
  event.preventDefault();
  activeGesture = {
    pointerId: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    startedAt: Date.now()
  };
  pad.classList.add("active");
  gestureArea.setPointerCapture(event.pointerId);
});

gestureArea.addEventListener("pointerup", (event) => {
  if (!activeGesture || event.pointerId !== activeGesture.pointerId) return;
  event.preventDefault();
  const gesture = activeGesture;
  activeGesture = null;
  pad.classList.remove("active");

  const dx = event.clientX - gesture.x;
  const dy = event.clientY - gesture.y;
  const distance = Math.hypot(dx, dy);
  const elapsed = Math.max(50, Math.min(3000, Date.now() - gesture.startedAt));

  if (distance <= TAP_MAX_DISTANCE && elapsed <= 500) {
    sendAction("/api/tap", {x: TAP_X, y: TAP_Y});
  } else if (distance >= SWIPE_MIN_DISTANCE) {
    let direction;
    if (Math.abs(dx) >= Math.abs(dy)) {
      direction = dx < 0 ? "left" : "right";
    } else {
      direction = dy < 0 ? "up" : "down";
    }
    sendAction("/api/swipe", {direction: direction, duration: elapsed});
  } else {
    status.textContent = "Gesture not recognized — tap or swipe farther.";
  }
});

function cancelGesture(event) {
  if (!activeGesture || event.pointerId !== activeGesture.pointerId) return;
  activeGesture = null;
  pad.classList.remove("active");
  status.textContent = "Gesture cancelled.";
}
gestureArea.addEventListener("pointercancel", cancelGesture);
gestureArea.addEventListener("lostpointercapture", cancelGesture);
</script>
</body>
</html>
